name: First Workflow

on: 
    push:
    pull_request:
        branches:
            - develop
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: make react build
              run: npm run build